# p6spy — runtime SQL capture for the sandbox.
#
# QueryFix's N+1 stage reads this log to corroborate what it found in source:
# a derived method repeated once per loop iteration shows up here as the same
# statement with only the bind parameter changing. Hibernate's own
# `logging.level.org.hibernate.SQL=DEBUG` cannot serve that purpose — it prints
# the statement with `?` placeholders and no timing, so repeated calls are
# indistinguishable from one another.

# p6spy proxies this driver; the real JDBC URL keeps the `jdbc:p6spy:` prefix.
driverlist=org.postgresql.Driver

# One statement per line, machine-parseable by integrations/p6spy.py. Keep the
# field order and separator stable — it is a parsing contract, so changing it
# means updating that parser and its fixtures together.
appender=com.p6spy.engine.spy.appender.FileLogger
# Under target/ because it is a generated artifact, and because p6spy's
# FileLogger does not create missing parent directories — it throws
# `couldn't create PrintStream` at startup. target/ always exists by the time
# the app runs, since the build creates it.
logfile=target/p6spy-statements.log
append=false
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime)|%(executionTime)|%(category)|%(sqlSingleLine)
databaseDialectDateFormat=yyyy-MM-dd HH:mm:ss.SSS

# `statement` and `batch` are what N+1 detection needs. `result`/`resultset`
# would log one line per returned row — that is tens of thousands of lines for
# the seeded corpus and drowns the statements we actually care about.
excludecategories=info,debug,result,resultset

# Log the statement even when it fails, so a broken fixture is visible here too.
autoflush=true
