# Sandbox configuration.
#
# Properties (not YAML) on purpose: this keeps Spring Boot off SnakeYAML, which
# is pinned to 1.33 for JavaFaker compatibility. See the note in pom.xml.
#
# The datasource points at a local throwaway Postgres. Never point this at a
# shared or production database — this app contains an UPDATE with no WHERE
# clause as a deliberate fixture.

spring.application.name=queryfix-sandbox

# Routed through p6spy so every statement Hibernate and Flyway issue is captured
# with its bind parameters and elapsed time. See spy.properties for the log
# format; the `jdbc:p6spy:` prefix wraps the real postgresql URL underneath.
spring.datasource.url=jdbc:p6spy:postgresql://localhost:5432/queryfix_sandbox
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.datasource.username=queryfix
spring.datasource.password=queryfix

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Seeder. Set seed-on-startup=false to boot without touching data.
sandbox.seed.seed-on-startup=true
sandbox.seed.customers=5000
sandbox.seed.random-seed=20260805

# Execute the read-path fixtures after seeding so they land in the p6spy log.
# Off by default: the N+1 fixture issues one query per seeded customer, which is
# a lot of statements to generate on an ordinary boot.
sandbox.exercise-fixtures=false

# Hard guard for the destructive planted bug. Leaving this false means the
# UPDATE-without-WHERE fixture is never executed, only analyzed statically.
sandbox.allow-destructive-fixtures=false

# The statement log QueryFix's N+1 stage reads comes from p6spy
# (target/p6spy-statements.log), which records bind parameters and elapsed time.
# Hibernate's own SQL logging is left off to avoid a second, less useful copy of
# the same statements; set this to DEBUG when you want them on the console.
logging.level.org.hibernate.SQL=INFO
